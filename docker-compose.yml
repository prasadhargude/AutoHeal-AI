# ==============================================================================
# AutoHeal AI — Production-Grade Multi-Service Docker Compose Orchestration
# ==============================================================================
# Architecture:
#   [Client / Browser]
#           │
#           ▼
#    frontend (Nginx :80)
#           │ /api/
#           ▼
#    api-gateway (Node.js :3000)
#       ├──► web-service (Spring Boot :8080) ──► postgres (:5432)
#       └──► ai-service (FastAPI :8000)
#
# Observability Pipeline:
#   Application Services ──(OTLP HTTP :4318)──► otel-collector ──(OTLP gRPC)──► tempo (:3200)
#   Prometheus (:9090) ──(Pull Scrape)──► [api-gateway, web-service, ai-service, otel-collector]
#   Grafana (:3001) ──(Queries)──► [Prometheus, Tempo]
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Database: PostgreSQL 16 Alpine
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: autoheal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autoheal}
      POSTGRES_USER: ${POSTGRES_USER:-autoheal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoheal_dev_pass_2026}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autoheal_user} -d ${POSTGRES_DB:-autoheal}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - autoheal-network

  # ----------------------------------------------------------------------------
  # 2. Schema Migrations: Flyway 10 Alpine
  # ----------------------------------------------------------------------------
  flyway:
    image: flyway/flyway:10-alpine
    container_name: autoheal-flyway
    command: -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-autoheal} -user=${POSTGRES_USER:-autoheal_user} -password=${POSTGRES_PASSWORD:-autoheal_dev_pass_2026} -connectRetries=60 migrate
    volumes:
      - ./database/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - autoheal-network

  # ----------------------------------------------------------------------------
  # 3. Web Service: Spring Boot 4 on Temurin JRE 21 Alpine
  # ----------------------------------------------------------------------------
  web-service:
    build:
      context: ./services/web-service
      dockerfile: Dockerfile
    image: autoheal-web-service:latest
    container_name: autoheal-web-service
    restart: unless-stopped
    environment:
      SERVER_PORT: ${WEB_SERVICE_PORT:-8080}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/${POSTGRES_DB:-autoheal}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-autoheal_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-autoheal_dev_pass_2026}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "${WEB_SERVICE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - autoheal-network

  # ----------------------------------------------------------------------------
  # 4. AI Service: FastAPI Python 3.11 Slim
  # ----------------------------------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    image: autoheal-ai-service:latest
    container_name: autoheal-ai-service
    restart: unless-stopped
    environment:
      PORT: ${AI_SERVICE_PORT:-8000}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: ai-service
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - autoheal-network

  # ----------------------------------------------------------------------------
  # 5. API Gateway: Express Node.js 20 Alpine
  # ----------------------------------------------------------------------------
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: autoheal-api-gateway:latest
    container_name: autoheal-api-gateway
    restart: unless-stopped
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT:-3000}
      WEB_SERVICE_URL: ${WEB_SERVICE_URL:-http://web-service:8080}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: api-gateway
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    depends_on:
      web-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - autoheal-network

  # ----------------------------------------------------------------------------
  # 6. Frontend: React / Vite served by Nginx 1.27 Alpine
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: autoheal-frontend:latest
    container_name: autoheal-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - autoheal-network

  # ----------------------------------------------------------------------------
  # 7. Distributed Tracing: Grafana Tempo 2.6.1
  # ----------------------------------------------------------------------------
  tempo:
    image: grafana/tempo:2.6.1
    container_name: autoheal-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./monitoring/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    networks:
      - autoheal-network

  # ----------------------------------------------------------------------------
  # 8. OpenTelemetry Collector Contrib 0.111.0
  # ----------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: autoheal-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./monitoring/otel-collector/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_COLLECTOR_GRPC_PORT:-4317}:4317"
      - "${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318"
      - "8888:8888"
      - "13133:13133"
    depends_on:
      - tempo
    networks:
      - autoheal-network

  # ----------------------------------------------------------------------------
  # 9. Metrics: Prometheus 2.54.1
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: autoheal-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      api-gateway:
        condition: service_healthy
      web-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - autoheal-network

  # ----------------------------------------------------------------------------
  # 10. Dashboards: Grafana 11.3.0
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.3.0
    container_name: autoheal-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-autoheal_grafana_2026}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
    networks:
      - autoheal-network

volumes:
  postgres_data:
    name: autoheal_postgres_data
    driver: local
  prometheus_data:
    name: autoheal_prometheus_data
    driver: local
  tempo_data:
    name: autoheal_tempo_data
    driver: local
  grafana_data:
    name: autoheal_grafana_data
    driver: local

networks:
  autoheal-network:
    name: autoheal-network
    driver: bridge
