spring.application.name=web-service

# ==============================================================================
# Actuator & Prometheus Metrics Configuration
# ==============================================================================

# Expose health, Prometheus, and info endpoints over HTTP.
# All other management endpoints remain disabled.
management.endpoints.web.exposure.include=health,prometheus,info

# Allow unrestricted access to the Prometheus scrape endpoint.
management.endpoint.prometheus.access=unrestricted

# Application-level tag applied to all Micrometer metrics for service identification.
management.metrics.tags.application=web-service

# Enable percentile histogram for HTTP request duration.
# This creates Prometheus histogram buckets that support arbitrary percentile
# calculations (p50, p95, p99) via PromQL histogram_quantile().
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ==============================================================================
# OpenTelemetry Distributed Tracing Configuration
# ==============================================================================

# 100% trace sampling for comprehensive anomaly detection and root cause analysis
management.tracing.sampling.probability=1.0

# Send OTLP spans to the OpenTelemetry Collector HTTP receiver
management.otlp.tracing.endpoint=http://otel-collector:4318/v1/traces

# Include traceId and spanId in application logs for trace-log correlation
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

